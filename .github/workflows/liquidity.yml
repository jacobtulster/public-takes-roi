name: Fetch 4casters liquidity

on:
  schedule:
    # GitHub won't fire cron more often than ~every 5m, so each run
    # loops for ~5 ticks × 60s ≈ once-per-minute snapshots.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fourcasters-liquidity
  # New 5m window replaces a stuck prior loop
  cancel-in-progress: true

jobs:
  liquidity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Snapshot every ~60s for this window
        env:
          FOURCASTERS_TOKEN: ${{ secrets.FOURCASTERS_TOKEN }}
        run: |
          set -e
          git config user.name "public-takes-bot"
          git config user.email "public-takes-bot@users.noreply.github.com"

          ticks=5
          for i in $(seq 1 "$ticks"); do
            echo "=== 4casters tick $i/$ticks ==="
            git pull --rebase --autostash origin main || git pull --rebase origin main || true
            python scripts/fetch_4casters_liquidity.py
            python scripts/liq_trust.py
            python scripts/attach_pick_liquidity.py
            git add data/liquidity.json data/liq_trust.json data/picks.json
            if git diff --staged --quiet; then
              echo "No liquidity / trust changes."
            else
              git commit -m "chore: refresh 4casters liquidity + fade trust + pick liq stamps"
              git push origin HEAD:main
            fi
            if [ "$i" -lt "$ticks" ]; then
              sleep 60
            fi
          done
