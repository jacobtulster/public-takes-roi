name: Grade public % takes

on:
  schedule:
    # Every 5 minutes — settle ESPN finals ASAP after tip ends
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grade-public-takes
  cancel-in-progress: true

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Grade open picks via ESPN scoreboards
        run: python scripts/grade_picks.py

      - name: Commit graded picks
        run: |
          set -euo pipefail
          git config user.name "public-takes-bot"
          git config user.email "public-takes-bot@users.noreply.github.com"

          try_commit_push() {
            git add data/picks.json
            if git diff --staged --quiet; then
              echo "No grading changes."
              return 0
            fi
            git commit -m "chore: grade settled public % takes (ESPN)"
            git push origin HEAD:main
          }

          if try_commit_push; then
            exit 0
          fi

          # Race with OddsLogic sync pushes — re-grade from tip and retry.
          for attempt in 1 2 3 4 5; do
            echo "Push rejected (attempt ${attempt}/5); re-grading from origin/main..."
            git fetch origin main
            git reset --hard origin/main
            python scripts/grade_picks.py
            if try_commit_push; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Failed to push after retries"
          exit 1
