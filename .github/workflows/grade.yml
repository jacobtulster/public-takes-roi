name: Grade public % takes

on:
  schedule:
    # Every 30 minutes — settle finals soon after games end
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Grade open picks via ESPN
        run: python scripts/grade_picks.py

      - name: Commit graded picks
        run: |
          git config user.name "public-takes-bot"
          git config user.email "public-takes-bot@users.noreply.github.com"
          git add data/picks.json
          if git diff --staged --quiet; then
            echo "No grading changes."
          else
            git commit -m "chore: grade settled public % takes"
            git push
          fi
