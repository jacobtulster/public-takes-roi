name: Fetch Novig liquidity

on:
  schedule:
    # Every 15 minutes (keyless public API)
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novig-liquidity
  cancel-in-progress: true

jobs:
  liquidity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Snapshot Novig public orderbooks
        run: |
          python scripts/fetch_novig_liquidity.py
          python scripts/liq_trust.py
          python scripts/attach_pick_liquidity.py

      - name: Commit Novig liquidity + fade trust
        run: |
          set -euo pipefail
          git config user.name "public-takes-bot"
          git config user.email "public-takes-bot@users.noreply.github.com"

          try_commit_push() {
            git add data/novig_liquidity.json data/liq_trust.json data/picks.json
            if git diff --staged --quiet; then
              echo "No Novig liquidity / trust changes."
              return 0
            fi
            git commit -m "chore: refresh Novig liquidity + fade trust + pick liq stamps"
            git push origin HEAD:main
          }

          if try_commit_push; then
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            echo "Push rejected (attempt ${attempt}/5); re-fetching from origin/main..."
            git fetch origin main
            git reset --hard origin/main
            python scripts/fetch_novig_liquidity.py
            python scripts/liq_trust.py
            python scripts/attach_pick_liquidity.py
            if try_commit_push; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Failed to push after retries"
          exit 1
