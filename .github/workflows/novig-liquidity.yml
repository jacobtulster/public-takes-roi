name: Fetch Novig liquidity

on:
  schedule:
    # Every 15 minutes (keyless public API)
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novig-liquidity
  cancel-in-progress: true

jobs:
  liquidity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Snapshot Novig public orderbooks
        run: |
          python scripts/fetch_novig_liquidity.py
          python scripts/liq_trust.py
          python scripts/attach_pick_liquidity.py

      - name: Commit Novig liquidity + fade trust
        run: |
          git config user.name "public-takes-bot"
          git config user.email "public-takes-bot@users.noreply.github.com"
          git add data/novig_liquidity.json data/liq_trust.json data/picks.json
          if git diff --staged --quiet; then
            echo "No Novig liquidity / trust changes."
          else
            git commit -m "chore: refresh Novig liquidity + fade trust + pick liq stamps"
            git push
          fi
